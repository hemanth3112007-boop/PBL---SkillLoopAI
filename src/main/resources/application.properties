spring.application.name=skillloop-backend
server.port=8080

# Default datasource: In-memory H2 with PostgreSQL compatibility mode
# Zero-configuration out of the box for quick frontend integration and testing
spring.datasource.url=jdbc:h2:mem:skillloopdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Flyway (disabled in default H2 mode to let JPA initialize, enabled in postgres profile)
spring.flyway.enabled=false

# OpenAPI Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# JWT Security
skillloop.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
skillloop.jwt.expiration-ms=86400000

# Synthetic Data Seeding (seeds rich demo records for courses, trainees, outcomes, follow-ups, skills, recommendations)
skillloop.seed.enabled=true
